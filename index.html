<html lang="bn">
<head>

        :root {
            --bg-deep: #030712;
            --bg-surface: rgba(15, 23, 42, 0.85);
            --gold-primary: #f59e0b;
            --gold-light: #fbbf24;
            --emerald-glow: #10b981;
            --text-main: #f8fafc;
            --text-sub: #cbd5e1;
            --border-glass: rgba(245, 158, 11, 0.3);
            --glass-blur: blur(20px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background: radial-gradient(circle at top, #0f172a 0%, var(--bg-deep) 85%);
            color: var(--text-main);
            line-height: 1.8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Header Navigation */
        header {
            background: rgba(3, 7, 18, 0.9);
            border-bottom: 1px solid var(--border-glass);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: var(--glass-blur);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.2rem;
        }

        .brand {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gold-light), #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand i {
            color: var(--gold-primary);
            font-size: 1.6rem;
            -webkit-text-fill-color: initial;
        }

        .tier1-menu {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tier1-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            color: var(--text-sub);
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tier1-btn:hover, .tier1-btn.active {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.3), rgba(16, 185, 129, 0.2));
            color: #fff;
            border-color: var(--gold-primary);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
            transform: translateY(-2px);
        }

        /* Sub-Category Filter Bar */
        .tier2-bar {
            background: rgba(15, 23, 42, 0.7);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 1rem 2rem;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .tier2-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-sub);
            padding: 0.4rem 1.2rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .tier2-btn:hover, .tier2-btn.active {
            background: var(--emerald-glow);
            color: #000;
            border-color: var(--emerald-glow);
            font-weight: 700;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }

        .container {
            max-width: 1350px;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
            flex: 1;
        }

        .hero-banner {
            text-align: center;
            padding: 3rem 1.5rem;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 24px;
            margin-bottom: 3rem;
            border: 1px solid var(--border-glass);
            backdrop-filter: var(--glass-blur);
        }

        .hero-banner h1 {
            font-size: 2.4rem;
            color: var(--gold-light);
            margin-bottom: 0.8rem;
        }

        .hero-banner p {
            color: var(--text-sub);
            font-size: 1.1rem;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Cards Grid Layout */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 2rem;
        }

        .topic-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 2rem;
            cursor: pointer;
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            backdrop-filter: var(--glass-blur);
        }

        .topic-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 25px rgba(245, 158, 11, 0.25);
            border-color: var(--gold-primary);
        }

        .card-badge {
            align-self: flex-start;
            background: rgba(245, 158, 11, 0.15);
            color: var(--gold-light);
            font-size: 0.85rem;
            padding: 0.3rem 0.8rem;
            border-radius: 12px;
            border: 1px solid rgba(245, 158, 11, 0.3);
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .topic-card h3 {
            font-size: 1.4rem;
            color: #fff;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .topic-card p {
            color: var(--text-sub);
            font-size: 1rem;
            margin-bottom: 1.5rem;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .tier3-btn {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(245, 158, 11, 0.05));
            border: 1px solid var(--gold-primary);
            color: var(--gold-light);
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            font-weight: 600;
            text-align: center;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .topic-card:hover .tier3-btn {
            background: var(--gold-primary);
            color: #000;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
        }

        /* Expanded Modal System */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 6, 23, 0.94);
            backdrop-filter: blur(20px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 1.5rem;
        }

        .modal-content {
            background: #0f172a;
            border: 1px solid var(--gold-primary);
            border-radius: 24px;
            padding: 3rem;
            max-width: 1000px;
            width: 100%;
            max-height: 88vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 0 60px rgba(245, 158, 11, 0.25);

        .close-modal {
            position: absolute;
            top: 1.5rem;
            right: 1.8rem;
            font-size: 2rem;
            color: var(--text-sub);
            cursor: pointer;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }

        .close-modal:hover { 
            color: #fff; 
            background: rgba(239, 68, 68, 0.8);
        }

        .modal-title {
            color: var(--gold-light);
            font-size: 2.2rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 1rem;
            line-height: 1.3;

            color: #e2e8f0;
            font-size: 1.15rem;
            white-space: pre-line;
            text-align: justify;
            line-height: 2.1;

            padding: 2.5rem;
            background: #020617;
            color: var(--text-sub);
            border-top: 1px solid var(--border-glass);
            margin-top: auto;

            .hero-banner h1 { font-size: 1.8rem; }
            .modal-content { padding: 1.8rem; }
            .cards-grid { grid-template-columns: 1fr; }

</head>

        function loadCategory(catKey, event) {
            currentCategory = catKey;
            currentSubCat = 'all';

            if(event) {
                document.querySelectorAll('.tier1-btn').forEach(btn => btn.classList.remove('active'));
                event.currentTarget.classList.add('active');
            }

            const catData = appData[catKey];
            document.getElementById('catTitle').innerText = catData.title;
            document.getElementById('catDesc').innerText = catData.desc;

            const tier2Bar = document.getElementById('tier2Bar');
            tier2Bar.innerHTML = '';
            catData.subCats.forEach(sub => {
                const btn = document.createElement('button');
                btn.className = `tier2-btn ${sub.id === 'all' ? 'active' : ''}`;
                btn.innerText = sub.name;
                btn.onclick = (e) => filterSubCategory(sub.id, e);
                tier2Bar.appendChild(btn);
            });

            renderCards();
        }

        function filterSubCategory(subId, event) {
            currentSubCat = subId;
            document.querySelectorAll('.tier2-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            renderCards();
        }

        function renderCards() {
            const cardsGrid = document.getElementById('cardsGrid');
            cardsGrid.innerHTML = '';
            const topics = appData[currentCategory].topics;

            const filtered = currentSubCat === 'all' 
                ? topics 
                : topics.filter(t => t.sub === currentSubCat);

            filtered.forEach(topic => {
                const card = document.createElement('div');
                card.className = 'topic-card';
                card.onclick = () => openModal(topic.key);

                card.innerHTML = `
                    <span class="card-badge"><i class="fa-solid fa-book-bookmark"></i> প্রজ্ঞাময় পাঠ</span>
                    <h3>${topic.title}</h3>
                    <p>${topic.preview}</p>
                    <div class="tier3-btn"><i class="fa-solid fa-book-open"></i> সম্পূর্ণ নিবন্ধ পড়ুন</div>
                `;
                cardsGrid.appendChild(card);
            });
        }

        function openModal(key) {
            const content = modalContents[key] || {
                title: "বিস্তারিত নিবন্ধ",
                body: "এই নিবন্ধটির বিস্তারিত তথ্য শীঘ্রই সংযুক্ত করা হবে।"
            };

            document.getElementById('modalTitle').innerText = content.title;
            document.getElementById('modalBody').innerText = content.body;
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        // App Init
        loadCategory('prophet');
    </script>
