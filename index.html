    <style>
        :root {
            --bg-dark: #070f17;
            --card-bg: rgba(18, 30, 45, 0.85);
            --gold: #d4af37;
            --emerald: #10b981;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --border: rgba(212, 175, 55, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Tier 1 Header & Main Menu */
        header {
            background: rgba(7, 15, 23, 0.98);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(12px);
        }

        .nav-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .brand {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Tier 1 Buttons */
        .tier1-menu {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tier1-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-sub);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .tier1-btn:hover, .tier1-btn.active {
            background: rgba(212, 175, 55, 0.2);
            color: var(--gold);
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        /* Tier 2 Sub-Category Filter Bar */
        .tier2-bar {
            background: rgba(13, 23, 34, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 0.8rem 1.5rem;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tier2-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            color: var(--text-main);
            padding: 0.4rem 1.1rem;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .tier2-btn:hover, .tier2-btn.active {
            background: var(--emerald);
            color: #000;
            border-color: var(--emerald);
            font-weight: 600;
        }

        /* Main Container */
        .container {
            max-width: 1250px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            flex: 1;
        }

        .hero-banner {
            text-align: center;
            padding: 2rem 1rem;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(7, 15, 23, 0) 75%);
            border-radius: 20px;
            margin-bottom: 2rem;
            border: 1px solid var(--border);
        }

        .hero-banner h1 {
            font-size: 2.2rem;
            color: var(--gold);
            margin-bottom: 0.5rem;
        }

        /* Tier 3 Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .topic-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .topic-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--emerald), var(--gold));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .topic-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.15);
        }

        .topic-card:hover::before {
            opacity: 1;
        }

        .topic-card h3 {
            font-size: 1.3rem;
            color: var(--gold);
            margin-bottom: 0.8rem;
        }

        .topic-card p {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-bottom: 1.2rem;
            flex-grow: 1;
        }

        /* Tier 3 Read Button */
        .tier3-btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
            transition: all 0.3s ease;
        }

        .topic-card:hover .tier3-btn {
            background: var(--gold);
            color: #000;
        }

        /* Modal Reader */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 1.5rem;
        }

        .modal-content {
            background: #0d1722;
            border: 1px solid var(--gold);
            border-radius: 20px;
            padding: 2.5rem;
            max-width: 900px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 0 35px rgba(0,0,0,0.9);
        }

        .close-modal {
            position: absolute;
            top: 1.2rem;
            right: 1.5rem;
            font-size: 1.8rem;
            color: var(--text-sub);
            cursor: pointer;
        }

        .close-modal:hover { color: var(--gold); }

        .modal-title {
            color: var(--gold);
            font-size: 2rem;
            margin-bottom: 1.2rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.8rem;
        }

        .modal-body {
            color: var(--text-main);
            font-size: 1.1rem;
            white-space: pre-line;
            text-align: justify;
            line-height: 1.9;
        }

        .highlight-box {
            background: rgba(16, 185, 129, 0.12);
            border-left: 4px solid var(--emerald);
            padding: 1rem 1.5rem;
            margin: 1.5rem 0;
            font-style: italic;
            border-radius: 0 8px 8px 0;
        }

        footer {
            text-align: center;
            padding: 1.8rem;
            background: rgba(0, 0, 0, 0.6);
            color: var(--text-sub);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: auto;
        }

        @media (max-width: 768px) {
            .nav-container { flex-direction: column; }
            .hero-banner h1 { font-size: 1.7rem; }
            .modal-content { padding: 1.5rem; }
        }

        // Trackers
        let currentCat = 'prophet';
        let currentSubCat = 'all';

        // Initialize Page
        window.onload = function() {
            renderTier2(appData['prophet'].subCats);
            renderTier3();
        };

        // Tier 1 Function (Fixed Event Passing)
        function loadCategory(catKey, evt) {
            currentCat = catKey;
            currentSubCat = 'all';

            const tier1Btns = document.querySelectorAll('.tier1-btn');
            tier1Btns.forEach(btn => btn.classList.remove('active'));
            if(evt && evt.currentTarget) {
                evt.currentTarget.classList.add('active');
            }

            const catData = appData[catKey];
            document.getElementById('catTitle').innerText = catData.title;
            document.getElementById('catDesc').innerText = catData.desc;

            renderTier2(catData.subCats);
            renderTier3();
        }

        // Tier 2 Function (Fixed Dynamic Rendering)
        function renderTier2(subCats) {
            const tier2Bar = document.getElementById('tier2Bar');
            tier2Bar.innerHTML = '';

            subCats.forEach(sub => {
                const btn = document.createElement('button');
                btn.className = `tier2-btn ${sub.id === 'all' ? 'active' : ''}`;
                btn.innerText = sub.name;
                btn.onclick = (e) => filterSubCat(sub.id, e);
                tier2Bar.appendChild(btn);
            });
        }

        function filterSubCat(subId, evt) {
            currentSubCat = subId;

            const tier2Btns = document.querySelectorAll('.tier2-btn');
            tier2Btns.forEach(btn => btn.classList.remove('active'));
            if(evt && evt.currentTarget) {
                evt.currentTarget.classList.add('active');
            }

            renderTier3();
        }

        // Tier 3 Function (Card Rendering)
        function renderTier3() {
            const cardsGrid = document.getElementById('cardsGrid');
            cardsGrid.innerHTML = '';

            const topics = appData[currentCat].topics;

            topics.forEach(topic => {
                if (currentSubCat === 'all' || topic.sub === currentSubCat) {
                    const card = document.createElement('div');
                    card.className = 'topic-card';
                    card.onclick = () => openModal(topic.key, topic.title);

                    card.innerHTML = `
                        <div>
                            <h3>${topic.title}</h3>
                            <p>${topic.preview}</p>
                        </div>
                        <div class="tier3-btn">সম্পূর্ণ বিস্তারিত পড়ুন</div>
                    `;
                    cardsGrid.appendChild(card);
                }
            });
        }

        // Modal Controls
        function openModal(key, title) {
            const content = fullDatabase[key] || "এই নিবন্ধটি খুব শীঘ্রই আরও বিস্তৃত তথ্যে আপডেট করা হবে।";
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerHTML = content;
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        window.onclick = function(e) {
            const modal = document.getElementById('modalOverlay');
            if (e.target === modal) closeModal();
        }
    </script>
