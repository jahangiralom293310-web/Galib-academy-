<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রজ্ঞার অলকানন্দা — মহৎ জীবনের অমলিন বার্তা</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-deep: #050b14;
            --bg-surface: rgba(15, 25, 40, 0.75);
            --gold-primary: #f39c12;
            --gold-light: #f1c40f;
            --emerald-glow: #10b981;
            --text-main: #f8fafc;
            --text-sub: #cbd5e1;
            --border-glass: rgba(243, 156, 18, 0.25);
            --glass-blur: blur(16px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background: radial-gradient(circle at top, #0f1e36 0%, var(--bg-deep) 80%);
            color: var(--text-main);
            line-height: 1.8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Header Navigation */
        header {
            background: rgba(5, 11, 20, 0.85);
            border-bottom: 1px solid var(--border-glass);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: var(--glass-blur);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.2rem;
        }

        .brand {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gold-light), #e67e22);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 0.5px;
        }

        .brand i {
            color: var(--gold-primary);
            font-size: 1.6rem;
            -webkit-text-fill-color: initial;
        }

        /* Tier 1 Buttons Bar */
        .tier1-menu {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: none;
        }

        .tier1-menu::-webkit-scrollbar {
            display: none;
        }

        .tier1-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            color: var(--text-sub);
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .tier1-btn:hover, .tier1-btn.active {
            background: linear-gradient(135deg, rgba(243, 156, 18, 0.25), rgba(16, 185, 129, 0.15));
            color: #fff;
            border-color: var(--gold-primary);
            box-shadow: 0 0 20px rgba(243, 156, 18, 0.4);
            transform: translateY(-2px);
        }

        /* Tier 2 Sub-Category Filter Bar */
        .tier2-bar {
            background: rgba(10, 18, 30, 0.7);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: center;
            gap: 12px;
            overflow-x: auto;
            backdrop-filter: blur(8px);
            scrollbar-width: none;
        }

        .tier2-bar::-webkit-scrollbar {
            display: none;
        }

        .tier2-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-sub);
            padding: 0.4rem 1.2rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .tier2-btn:hover, .tier2-btn.active {
            background: var(--emerald-glow);
            color: #000;
            border-color: var(--emerald-glow);
            font-weight: 700;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }

        /* Main Container */
        .container {
            max-width: 1350px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            flex: 1;
        }

        .hero-banner {
            text-align: center;
            padding: 2.5rem 1.5rem;
            background: rgba(15, 25, 40, 0.5);
            border-radius: 24px;
            margin-bottom: 2.5rem;
            border: 1px solid var(--border-glass);
            backdrop-filter: var(--glass-blur);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .hero-banner h1 {
            font-size: 2.3rem;
            color: var(--gold-light);
            margin-bottom: 0.8rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .hero-banner p {
            color: var(--text-sub);
            font-size: 1.1rem;
            max-width: 750px;
            margin: 0 auto 1.5rem;
        }

        /* Search Box Design */
        .search-box {
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.8rem 1.2rem 0.8rem 3rem;
            background: rgba(5, 11, 20, 0.8);
            border: 1px solid var(--border-glass);
            border-radius: 30px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 15px rgba(243, 156, 18, 0.3);
        }

        .search-box i {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold-primary);
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
        }

        .topic-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 2rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            backdrop-filter: var(--glass-blur);
        }

        .topic-card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(243, 156, 18, 0.2);
            border-color: var(--gold-primary);
        }

        .topic-card .card-badge {
            align-self: flex-start;
            background: rgba(243, 156, 18, 0.15);
            color: var(--gold-light);
            font-size: 0.8rem;
            padding: 0.3rem 0.8rem;
            border-radius: 12px;
            border: 1px solid rgba(243, 156, 18, 0.3);
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .topic-card h3 {
            font-size: 1.35rem;
            color: #fff;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .topic-card p {
            color: var(--text-sub);
            font-size: 0.98rem;
            margin-bottom: 1.5rem;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .tier3-btn {
            background: linear-gradient(135deg, rgba(243, 156, 18, 0.2), rgba(243, 156, 18, 0.05));
            border: 1px solid var(--gold-primary);
            color: var(--gold-light);
            padding: 0.7rem 1.2rem;
            border-radius: 12px;
            font-weight: 600;
            text-align: center;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .topic-card:hover .tier3-btn {
            background: var(--gold-primary);
            color: #000;
            box-shadow: 0 0 15px rgba(243, 156, 18, 0.5);
        }

        .no-data {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: var(--text-sub);
            font-size: 1.2rem;
            background: rgba(15, 25, 40, 0.4);
            border-radius: 16px;
            border: 1px dashed var(--border-glass);
        }

        /* Modal Ultra Reader */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 6, 12, 0.92);
            backdrop-filter: blur(15px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 1.5rem;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: #0b1320;
            border: 1px solid var(--gold-primary);
            border-radius: 24px;
            padding: 3rem;
            max-width: 900px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 0 50px rgba(243, 156, 18, 0.25);
        }

        .close-modal {
            position: absolute;
            top: 1.5rem;
            right: 1.8rem;
            font-size: 1.8rem;
            color: var(--text-sub);
            cursor: pointer;
            transition: all 0.3s ease;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
        }

        .close-modal:hover { 
            color: #fff; 
            background: rgba(239, 68, 68, 0.8);
        }

        .modal-title {
            color: var(--gold-light);
            font-size: 2rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 1rem;
            line-height: 1.3;
        }

        .modal-body {
            color: var(--text-main);
            font-size: 1.1rem;
            white-space: pre-line;
            text-align: justify;
            line-height: 1.9;
        }

        .highlight-box {
            background: rgba(16, 185, 129, 0.1);
            border-left: 4px solid var(--emerald-glow);
            padding: 1.2rem 1.8rem;
            margin: 1.5rem 0;
            font-style: italic;
            border-radius: 0 12px 12px 0;
            color: #e2e8f0;
        }

        .quote-box {
            background: rgba(243, 156, 18, 0.1);
            border-left: 4px solid var(--gold-primary);
            padding: 1.2rem 1.8rem;
            margin: 1.5rem 0;
            border-radius: 0 12px 12px 0;
            font-weight: 500;
        }

        footer {
            text-align: center;
            padding: 2rem;
            background: rgba(3, 7, 13, 0.95);
            color: var(--text-sub);
            border-top: 1px solid var(--border-glass);
            margin-top: auto;
            font-size: 0.95rem;
        }

        @media (max-width: 768px) {
            .nav-container { flex-direction: column; align-items: stretch; }
            .brand { justify-content: center; }
            .hero-banner h1 { font-size: 1.7rem; }
            .modal-content { padding: 1.8rem; }
            .cards-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Tier 1 Header Menu -->
    <header>
        <div class="nav-container">
            <div class="brand">
                <i class="fa-solid fa-book-open-reader"></i>
                <span>প্রজ্ঞার অলকানন্দা</span>
            </div>
            <nav class="tier1-menu">
                <button class="tier1-btn active" onclick="loadCategory('prophet', event)"><i class="fa-solid fa-kaaba"></i> রাসূল (সাঃ)-এর জীবন</button>
                <button class="tier1-btn" onclick="loadCategory('sahabi', event)"><i class="fa-solid fa-users-rays"></i> সাহাবিদের মহাকাব্য</button>
                <button class="tier1-btn" onclick="loadCategory('success', event)"><i class="fa-solid fa-trophy"></i> সফলতার ইতিহাস</button>

                <button class="tier1-btn" onclick="loadCategory('fun', event)"><i class="fa-solid fa-lightbulb"></i> প্রজ্ঞাময় গল্প</button>
            </nav>
        </div>
    </header>

    <!-- Tier 2 Filter Sub-Menu Bar -->
    <div class="tier2-bar" id="tier2Bar">
        <!-- Dynamic Sub-category buttons will load here -->
    </div>

    <!-- Main Content Container -->
    <div class="container">
        <div class="hero-banner" id="heroBanner">

            <p id="catDesc">রহমত, প্রজ্ঞা, মহানুভবতা ও সাহসিকতার এক চিরন্তন মহাসমুদ্র। প্রতিটি ঘটনা থেকে শিক্ষা নিন এবং জীবনে প্রয়োগ করুন।</p>
            
            <!-- Dynamic Search Feature -->
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="খুঁজুন (যেমন: তায়েফ, ক্ষমা, এডিসন, সালাত...)" oninput="handleSearch()">
            </div>
        </div>

        <div class="cards-grid" id="cardsGrid">
            <!-- Dynamic Topic Cards Render Here -->
        </div>
    </div>

    <!-- Modal Reader System -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2 class="modal-title" id="modalTitle">শিরোনাম</h2>
            <div class="modal-body" id="modalBody">
                বিস্তারিত পাঠাগার লোড হচ্ছে...
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 প্রজ্ঞার অলকানন্দা — মহৎ জীবনের আলোকবর্তিকা ও জ্ঞানভাণ্ডার।</p>
    </footer>

        // Tier 1 Function
        function loadCategory(catKey, evt) {
            currentCat = catKey;
            currentSubCat = 'all';

            // Clear Search Box
            document.getElementById('searchInput').value = '';

            const tier1Btns = document.querySelectorAll('.tier1-btn');
            tier1Btns.forEach(btn => btn.classList.remove('active'));
            if(evt && evt.currentTarget) {
                evt.currentTarget.classList.add('active');
            }

            const catData = appData[catKey];
            document.getElementById('catTitle').innerText = catData.title;
            document.getElementById('catDesc').innerText = catData.desc;

            renderTier2(catData.subCats);
            renderTier3();
        }

        // Tier 2 Function
        function renderTier2(subCats) {
            const tier2Bar = document.getElementById('tier2Bar');
            tier2Bar.innerHTML = '';

            subCats.forEach(sub => {
                const btn = document.createElement('button');
                btn.className = `tier2-btn ${sub.id === 'all' ? 'active' : ''}`;
                btn.innerText = sub.name;
                btn.onclick = (e) => filterSubCat(sub.id, e);
                tier2Bar.appendChild(btn);
            });
        }

        function filterSubCat(subId, evt) {
            currentSubCat = subId;

            tier2Btns.forEach(btn => btn.classList.remove('active'));
            if(evt && evt.currentTarget) {
                evt.currentTarget.classList.add('active');
            }

            renderTier3();
        }

            const query = document.getElementById('searchInput').value.trim().toLowerCase();

        function renderTier3(searchQuery = '') {
            const cardsGrid = document.getElementById('cardsGrid');
            cardsGrid.innerHTML = '';

            const topics = appData[currentCat].topics;
            let count = 0;

            topics.forEach(topic => {
                const matchesSubCat = (currentSubCat === 'all' || topic.sub === currentSubCat);
                const matchesSearch = searchQuery === '' || 
                                      topic.title.toLowerCase().includes(searchQuery) || 
                                      topic.preview.toLowerCase().includes(searchQuery);

                if (matchesSubCat && matchesSearch) {
                    count++;
                    const card = document.createElement('div');
                    card.className = 'topic-card';
                    card.onclick = () => openModal(topic.key, topic.title);

                    card.innerHTML = `
                        <div>
                            <span class="card-badge"><i class="fa-solid fa-feather"></i> নিবন্ধ</span>
                            <h3>${topic.title}</h3>
                            <p>${topic.preview}</p>
                        </div>
                        <div class="tier3-btn">
                            <span>সম্পূর্ণ ঘটনাটি পড়ুন</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </div>
                    `;
                    cardsGrid.appendChild(card);
                }
            });

            if (count === 0) {
                cardsGrid.innerHTML = `<div class="no-data"><i class="fa-solid fa-folder-open" style="font-size: 2rem; margin-bottom: 10px; color: var(--gold-primary);"></i><br>দুঃখিত, কোনো তথ্য খুঁজে পাওয়া যায়নি!</div>`;
            }
        }

        // Modal Reader System
        function openModal(key, title) {
            const content = fullDatabase[key] || "এই বিশেষ নিবন্ধটির বিস্তারিত অংশ শীঘ্রই সংকলন করে যুক্ত করা হবে।";
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerHTML = content;
            document.getElementById('modalOverlay').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // Close on Overlay Click or Esc Key
        window.onclick = function(e) {
            const modal = document.getElementById('modalOverlay');
            if (e.target === modal) closeModal();
        }

        window.onkeydown = function(e) {
            if (e.key === 'Escape') closeModal();
        }
    </script>
</body>
</html>
